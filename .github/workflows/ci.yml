name: Rust quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - name: Install pinned quality tools
        run: |
          cargo +1.98.1 install --locked --version 0.9.146 cargo-nextest
          cargo +1.98.1 install --locked --version 0.20.2 cargo-deny
      - name: Check workspace
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo nextest run --locked --workspace
          cargo test --locked --workspace --doc
          cargo deny check
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
