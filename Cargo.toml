[workspace]
members = ["crates/model", "crates/config", "crates/telemetry", "crates/instrument", "integration-tests"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
url = "=2.5.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
serde_json = "=1.0.151"
serde = { version = "=1.0.228", features = ["derive"] }
bigdecimal = "=0.4.10"
toml = "=1.1.6"
sha2 = "=0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
